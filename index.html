<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Royale Prototype</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      background: #5c9b45;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,.55);
      padding: 10px;
      border-radius: 8px;
      z-index: 10;
    }

    #controls {
      position: fixed;
      bottom: 25px;
      left: 25px;
      z-index: 10;
    }

    button {
      width: 60px;
      height: 50px;
      margin: 3px;
      border: 0;
      border-radius: 10px;
      background: rgba(255,255,255,.75);
      font-size: 20px;
      font-weight: bold;
    }

    #shoot {
      position: fixed;
      right: 25px;
      bottom: 40px;
      width: 90px;
      height: 70px;
      background: rgba(220,60,60,.8);
      color: white;
    }
  </style>
</head>

<body>

<div id="info">
  ❤️ Health: <span id="health">100</span><br>
  🎯 Enemies: <span id="enemies">5</span>
</div>

<canvas id="game"></canvas>

<div id="controls">
  <div style="text-align:center">
    <button onclick="move(0,-1)">⬆️</button>
  </div>

  <button onclick="move(-1,0)">⬅️</button>
  <button onclick="move(1,0)">➡️</button>

  <div style="text-align:center">
    <button onclick="move(0,1)">⬇️</button>
  </div>
</div>

<button id="shoot" onclick="shoot()">FIRE 🔫</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  size: 25,
  speed: 18,
  health: 100
};

let enemies = [];

for (let i = 0; i < 5; i++) {
  enemies.push({
    x: Math.random() * (canvas.width - 60) + 30,
    y: Math.random() * (canvas.height - 60) + 30,
    size: 22,
    health: 100
  });
}

function drawPlayer() {
  ctx.fillStyle = "blue";
  ctx.fillRect(
    player.x - player.size / 2,
    player.y - player.size / 2,
    player.size,
    player.size
  );
}

function drawEnemies() {
  enemies.forEach(enemy => {
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.size / 2, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawMap() {
  ctx.fillStyle = "#5c9b45";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "rgba(255,255,255,.15)";

  for (let x = 0; x < canvas.width; x += 50) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }

  for (let y = 0; y < canvas.height; y += 50) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function move(dx, dy) {
  player.x += dx * player.speed;
  player.y += dy * player.speed;

  player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
  player.y = Math.max(20, Math.min(canvas.height - 20, player.y));
}

function shoot() {
  if (enemies.length === 0) return;

  let nearest = null;
  let distance = Infinity;

  enemies.forEach(enemy => {
    let dx = enemy.x - player.x;
    let dy = enemy.y - player.y;
    let d = Math.sqrt(dx * dx + dy * dy);

    if (d < distance) {
      distance = d;
      nearest = enemy;
    }
  });

  if (nearest && distance < 250) {
    nearest.health -= 50;

    if (nearest.health <= 0) {
      enemies = enemies.filter(e => e !== nearest);
      document.getElementById("enemies").textContent = enemies.length;
    }
  }
}

function gameLoop() {
  drawMap();
  drawPlayer();
  drawEnemies();

  document.getElementById("health").textContent = player.health;

  if (enemies.length === 0) {
    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.fillText(
      "YOU WIN!",
      canvas.width / 2 - 80,
      canvas.height / 2
    );
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
  </html>
