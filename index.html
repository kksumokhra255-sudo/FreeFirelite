<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Battle Royale - Upgrade 8</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  z-index:20;
  color:white;
  background:rgba(0,0,0,.65);
  padding:10px 14px;
  border-radius:12px;
  line-height:1.5;
  font-size:15px;
}

#inventory{
  position:fixed;
  top:10px;
  right:10px;
  z-index:20;
  color:white;
  background:rgba(0,0,0,.7);
  padding:10px;
  width:175px;
  border-radius:12px;
}

.weapon{
  padding:8px;
  margin:4px 0;
  background:rgba(255,255,255,.12);
  border-radius:7px;
}

.selected{
  background:rgba(255,205,30,.45);
}

#controls{
  position:fixed;
  bottom:15px;
  left:15px;
  z-index:30;
  text-align:center;
}

button{
  border:0;
  border-radius:12px;
  font-weight:bold;
}

.move{
  width:58px;
  height:50px;
  margin:3px;
  font-size:20px;
  background:rgba(255,255,255,.8);
}

#fire{
  position:fixed;
  right:20px;
  bottom:30px;
  z-index:30;
  width:105px;
  height:72px;
  border-radius:22px;
  background:#d9362e;
  color:white;
  font-size:18px;
}

#switch{
  position:fixed;
  right:140px;
  bottom:42px;
  z-index:30;
  width:75px;
  height:55px;
  background:#202020;
  color:white;
}

#message{
  display:none;
  position:fixed;
  z-index:100;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  color:white;
  background:rgba(0,0,0,.92);
  padding:30px;
  border-radius:18px;
  text-align:center;
  font-size:30px;
}

#restart{
  width:150px;
  height:50px;
  margin-top:15px;
  font-size:17px;
}
</style>
</head>

<body>

<div id="hud">
❤️ Health: <span id="health">100</span><br>
🎯 Enemies: <span id="enemyCount">6</span><br>
🟢 Safe Zone: <span id="zone">100</span>%
</div>

<div id="inventory">
<b>🎒 WEAPON INVENTORY</b>

<div id="w0" class="weapon selected">
🔫 Pistol — <span id="a0">30</span>
</div>

<div id="w1" class="weapon">
🔫 Rifle — <span id="a1">90</span>
</div>

<div id="w2" class="weapon">
🔫 Shotgun — <span id="a2">12</span>
</div>
</div>

<div id="controls">

<div>
<button class="move"
onclick="movePlayer(0,-1)">⬆️</button>
</div>

<div>
<button class="move"
onclick="movePlayer(-1,0)">⬅️</button>

<button class="move"
onclick="movePlayer(1,0)">➡️</button>
</div>

<div>
<button class="move"
onclick="movePlayer(0,1)">⬇️</button>
</div>

</div>

<button id="switch"
onclick="switchWeapon()">
SWITCH
</button>

<button id="fire"
onclick="shoot()">
FIRE 🔫
</button>

<div id="message">
<div id="messageText"></div>
<button id="restart"
onclick="location.reload()">
RESTART
</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

/* =========================
   ENGINE
========================= */

const scene=new THREE.Scene();

scene.background=
new THREE.Color(0x87ceeb);

scene.fog=
new THREE.Fog(
  0x87ceeb,
  45,
  180
);

const camera=
new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  300
);

const renderer=
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   LIGHTING
========================= */

const skyLight=
new THREE.HemisphereLight(
  0xffffff,
  0x304020,
  2.2
);

scene.add(skyLight);

const sunlight=
new THREE.DirectionalLight(
  0xffffff,
  3
);

sunlight.position.set(
  -40,
  70,
  30
);

sunlight.castShadow=true;

sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;

sunlight.shadow.camera.left=-100;
sunlight.shadow.camera.right=100;
sunlight.shadow.camera.top=100;
sunlight.shadow.camera.bottom=-100;

scene.add(sunlight);


/* =========================
   GROUND
========================= */

const ground=
new THREE.Mesh(
  new THREE.PlaneGeometry(
    180,
    180
  ),
  new THREE.MeshStandardMaterial({
    color:0x4f963e,
    roughness:1
  })
);

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================
   GRASS DETAIL
========================= */

for(let i=0;i<700;i++){

  const grass=
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .025,
      .12+Math.random()*.18,
      .025
    ),
    new THREE.MeshStandardMaterial({
      color:
      0x357b2c
    })
  );

  grass.position.set(
    Math.random()*170-85,
    .08,
    Math.random()*170-85
  );

  scene.add(grass);
}


/* =========================
   PLAYER
========================= */

const player=
new THREE.Group();

player.position.set(
  0,
  0,
  0
);

scene.add(player);

player.userData.health=100;
player.userData.walkTime=0;


/* BODY */

const body=
new THREE.Mesh(
  new THREE.CapsuleGeometry(
    .42,
    .75,
    8,
    16
  ),
  new THREE.MeshStandardMaterial({
    color:0x1769ff,
    roughness:.7
  })
);

body.position.y=1.15;

body.castShadow=true;

player.add(body);


/* HEAD */

const head=
new THREE.Mesh(
  new THREE.SphereGeometry(
    .31,
    24,
    24
  ),
  new THREE.MeshStandardMaterial({
    color:0xffc39b,
    roughness:.8
  })
);

head.position.y=1.92;

head.castShadow=true;

player.add(head);


/* HAIR */

const hair=
new THREE.Mesh(
  new THREE.SphereGeometry(
    .32,
    20,
    20,
    0,
    Math.PI*2,
    0,
    Math.PI*.5
  ),
  new THREE.MeshStandardMaterial({
    color:0x24160f
  })
);

hair.position.y=2.04;

player.add(hair);


/* EYES */

function makeEye(x){

  const eye=
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .04,
      8,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0x111111
    })
  );

  eye.position.set(
    x,
    1.97,
    -.285
  );

  player.add(eye);
}

makeEye(-.10);
makeEye(.10);


/* ARMS */

const armMaterial=
new THREE.MeshStandardMaterial({
  color:0x1769ff
});

const leftArm=
new THREE.Mesh(
  new THREE.CapsuleGeometry(
    .11,
    .58,
    6,
    10
  ),
  armMaterial
);

leftArm.position.set(
  -.48,
  1.25,
  -.05
);

leftArm.rotation.z=.25;

leftArm.castShadow=true;

player.add(leftArm);


const rightArm=
new THREE.Mesh(
  new THREE.CapsuleGeometry(
    .11,
    .58,
    6,
    10
  ),
  armMaterial
);

rightArm.position.set(
  .48,
  1.25,
  -.05
);

rightArm.rotation.z=-.25;

rightArm.castShadow=true;

player.add(rightArm);


/* LEGS */

const legMaterial=
new THREE.MeshStandardMaterial({
  color:0x18294d
});

const leftLeg=
new THREE.Mesh(
  new THREE.CapsuleGeometry(
    .14,
    .65,
    6,
    10
  ),
  legMaterial
);

leftLeg.position.set(
  -.20,
  .48,
  0
);

leftLeg.castShadow=true;

player.add(leftLeg);


const rightLeg=
new THREE.Mesh(
  new THREE.CapsuleGeometry(
    .14,
    .65,
    6,
    10
  ),
  legMaterial
);

rightLeg.position.set(
  .20,
  .48,
  0
);

rightLeg.castShadow=true;

player.add(rightLeg);


/* =========================
   WEAPON
========================= */

const gun=
new THREE.Group();

const gunBody=
new THREE.Mesh(
  new THREE.BoxGeometry(
    .16,
    .18,
    .9
  ),
  new THREE.MeshStandardMaterial({
    color:0x171717,
    metalness:.7,
    roughness:.3
  })
);

gun.add(gunBody);

const barrel=
new THREE.Mesh(
  new THREE.CylinderGeometry(
    .055,
    .055,
    .45,
    12
  ),
  new THREE.MeshStandardMaterial({
    color:0x090909,
    metalness:.8
  })
);

barrel.rotation.x=
Math.PI/2;

barrel.position.z=-.62;

gun.add(barrel);

gun.position.set(
  .43,
  1.35,
  -.55
);

gun.rotation.x=
Math.PI/2;

player.add(gun);


/* =========================
   WEAPONS
========================= */

const weapons=[
  {
    name:"Pistol",
    ammo:30,
    damage:40,
    cooldown:18
  },
  {
    name:"Rifle",
    ammo:90,
    damage:25,
    cooldown:7
  },
  {
    name:"Shotgun",
    ammo:12,
    damage:75,
    cooldown:32
  }
];

let currentWeapon=0;
let shootCooldown=0;


/* =========================
   ENEMY
========================= */

const enemies=[];

      roughness:.8

  eHead.position.y=1.92;

  eHead.castShadow=true;

  enemy.add(eHead);

    const eHair=
    new THREE.Mesh(

    eHair.position.y=2.03;

    enemy.add(eHair);

    new THREE.Mesh(

      })
    );

    eye.position.set(

      1.97,

    enemy.add(eye);

  });


  /* ARMS */

  const arms=[];

  [-1,1].forEach(side=>{

    const arm=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .11,
        .58,
        6,
        10
      ),
      bodyMat
    );

    arm.position.set(
      side*.47,
      1.25,
      -.04
    );

    arm.rotation.z=
      side*.25;

    arm.castShadow=true;

    enemy.add(arm);

    arms.push(arm);

  });


  /* LEGS */

  [-1,1].forEach(side=>{

    const leg=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .14,
        .65,
        6,
        10
      ),
      new THREE.MeshStandardMaterial({
        color:0x242424
      })
    );
