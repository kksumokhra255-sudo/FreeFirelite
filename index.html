<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Battle Royale - Upgrade 5</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{display:block}

#info{
  position:fixed;
  top:10px;
  left:10px;
  color:white;
  background:rgba(0,0,0,.72);
  padding:10px 14px;
  border-radius:10px;
  font-size:16px;
  z-index:10;
  line-height:1.5;
}

#controls{
  position:fixed;
  bottom:18px;
  left:18px;
  z-index:10;
  text-align:center;
}

button{
  width:62px;
  height:52px;
  margin:3px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.82);
  font-size:21px;
  font-weight:bold;
}

#shoot{
  position:fixed;
  right:20px;
  bottom:38px;
  width:105px;
  height:75px;
  border-radius:20px;
  background:#d94335;
  color:white;
  font-size:19px;
}

#message{
  display:none;
  position:fixed;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  background:rgba(0,0,0,.9);
  padding:25px;
  border-radius:15px;
  text-align:center;
  font-size:30px;
  z-index:20;
}

#restart{
  width:150px;
  margin-top:15px;
  font-size:17px;
}
</style>
</head>

<body>

<div id="info">
❤️ Health: <span id="health">100</span><br>
🎯 Enemies: <span id="enemyCount">6</span><br>
🔫 Ammo: <span id="ammo">30</span><br>
🟢 Safe Zone: <span id="zone">100%</span>
</div>

<canvas id="game"></canvas>

<div id="controls">
  <div>
    <button onclick="move(0,-1)">⬆️</button>
  </div>

  <div>
    <button onclick="move(-1,0)">⬅️</button>
    <button onclick="move(1,0)">➡️</button>
  </div>

  <div>
    <button onclick="move(0,1)">⬇️</button>
  </div>
</div>

<button id="shoot" onclick="shoot()">FIRE 🔫</button>

<div id="message">
  <div id="messageText"></div>
  <button id="restart" onclick="location.reload()">RESTART</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

resize();
window.addEventListener("resize",resize);

let player={
  x:canvas.width/2,
  y:canvas.height/2,
  size:28,
  speed:18,
  health:100,
  angle:0,
  hitFlash:0
};

let ammo=30;

let bullets=[];
let enemyBullets=[];
let enemies=[];
let loot=[];

let muzzleFlash=0;

/* SAFE ZONE */

let safeZone={
  x:canvas.width/2,
  y:canvas.height/2,
  radius:Math.min(canvas.width,canvas.height)*0.45,
  minRadius:Math.min(canvas.width,canvas.height)*0.18
};

/* OBSTACLES */

let obstacles=[
  {x:120,y:150,w:90,h:60},
  {x:canvas.width-210,y:170,w:100,h:65},
  {x:150,y:canvas.height-190,w:100,h:65},
  {x:canvas.width-250,y:canvas.height-180,w:110,h:70}
];

/* ENEMIES */

for(let i=0;i<6;i++){

  enemies.push({

    x:Math.random()*(canvas.width-80)+40,
    y:Math.random()*(canvas.height-160)+80,

    size:25,
    health:100,

    speed:.65+Math.random()*.55,

    attackCooldown:0,
    shootCooldown:50+Math.random()*80

  });

}

/* LOOT */

for(let i=0;i<7;i++){

  loot.push({

    x:Math.random()*(canvas.width-80)+40,
    y:Math.random()*(canvas.height-120)+60,

    type:i%3===0 ? "medkit" : "ammo"

  });

}

/* MAP */

function drawMap(){

  ctx.fillStyle="#5c9b45";
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.strokeStyle="rgba(255,255,255,.10)";

  for(let x=0;x<canvas.width;x+=50){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,canvas.height);
    ctx.stroke();

  }

  for(let y=0;y<canvas.height;y+=50){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(canvas.width,y);
    ctx.stroke();

  }

  obstacles.forEach(o=>{

    ctx.fillStyle="#72502f";

    ctx.fillRect(
      o.x,
      o.y,
      o.w,
      o.h
    );

    ctx.fillStyle="#8b633d";

    ctx.fillRect(
      o.x+8,
      o.y+8,
      o.w-16,
      o.h-16
    );

  });

}

/* SAFE ZONE */

function drawSafeZone(){

  ctx.fillStyle="rgba(40,80,255,.20)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.save();

  ctx.globalCompositeOperation="destination-out";

  ctx.beginPath();

  ctx.arc(
    safeZone.x,
    safeZone.y,
    safeZone.radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  ctx.strokeStyle="rgba(80,170,255,.9)";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.arc(
    safeZone.x,
    safeZone.y,
    safeZone.radius,
    0,
    Math.PI*2
  );

  ctx.stroke();

}

/* LOOT */

function drawLoot(){

  loot.forEach(item=>{

    if(item.type==="ammo"){

      ctx.fillStyle="#ffd21f";

      ctx.fillRect(
        item.x-10,
        item.y-10,
        20,
        20
      );

      ctx.fillStyle="#222";
      ctx.font="16px Arial";

      ctx.fillText(
        "A",
        item.x-5,
        item.y+6
      );

    }

    if(item.type==="medkit"){

      ctx.fillStyle="white";

      ctx.fillRect(
        item.x-11,
        item.y-11,
        22,
        22
      );

      ctx.fillStyle="red";

      ctx.fillRect(
        item.x-4,
        item.y-9,
        8,
        18
      );

      ctx.fillRect(
        item.x-9,
        item.y-4,
        18,
        8
      );

    }

  });

}

/* PLAYER */

function drawPlayer(){

  if(player.hitFlash>0){

    ctx.fillStyle="white";
    player.hitFlash--;

  }else{

    ctx.fillStyle="#1769ff";

  }

  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y,
    16,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#ffd0a0";

  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y-5,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();

  const gunLength=30;

  const gunX=
    player.x+
    Math.cos(player.angle)*gunLength;

  const gunY=
    player.y+
    Math.sin(player.angle)*gunLength;

  ctx.strokeStyle="#222";
  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    player.x,
    player.y
  );

  ctx.lineTo(
    gunX,
    gunY
  );

  ctx.stroke();

  if(muzzleFlash>0){

    ctx.fillStyle="#ffd21f";

    ctx.beginPath();

    ctx.arc(
      gunX,
      gunY,
      10,
      0,
      Math.PI*2
    );

    ctx.fill();

    muzzleFlash--;

  }

}

/* ENEMIES */

function drawEnemies(){

  enemies.forEach(enemy=>{

    ctx.fillStyle="#d91f1f";

    ctx.beginPath();

    ctx.arc(
      enemy.x,
      enemy.y,
      enemy.size/2,
      0,
      Math.PI*2
    );

    ctx.fill();

    /* HEALTH BAR */

    ctx.fillStyle="#222";

    ctx.fillRect(
      enemy.x-18,
      enemy.y-22,
      36,
      5
    );

    ctx.fillStyle="#35d447";

    ctx.fillRect(
      enemy.x-18,
      enemy.y-22,
      36*(enemy.health/100),
      5
    );

  });

}

/* BULLETS */

function drawBullets(){

  bullets.forEach(b=>{

    ctx.fillStyle="#ffe01b";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      5,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  enemyBullets.forEach(b=>{

    ctx.fillStyle="#ff4b4b";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      5,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

}

/* MOVEMENT */

function move(dx,dy){

  player.x+=dx*player.speed;
  player.y+=dy*player.speed;

  player.x=Math.max(
    20,
    Math.min(
      canvas.width-20,
      player.x
    )
  );

  player.y=Math.max(
    20,
    Math.min(
      canvas.height-20,
      player.y
    )
  );

  if(dx!==0 || dy!==0){

    player.angle=Math.atan2(
      dy,
      dx
    );

  }

}

/* NEAREST ENEMY */

function nearestEnemy(){

  let target=null;
  let best=Infinity;

  enemies.forEach(enemy=>{

    const dx=
      enemy.x-player.x;

    const dy=
      enemy.y-player.y;

    const d=
      Math.sqrt(dx*dx+dy*dy);

    if(d<best){

      best=d;
      target=enemy;

    }

  });

  return target;

}

/* PLAYER SHOOT */

function shoot(){

  if(ammo<=0)
    return;

  const target=nearestEnemy();

  if(!target)
    return;

  const dx=
    target.x-player.x;

  const dy=
    target.y-player.y;

  const distance=
    Math.sqrt(dx*dx+dy*dy);

  player.angle=
    Math.atan2(dy,dx);

  bullets.push({

    x:
      player.x+
      Math.cos(player.angle)*25,

    y:
      player.y+
      Math.sin(player.angle)*25,

    vx:
      (dx/distance)*13,

    vy:
      (dy/distance)*13,

    damage:50

  });

  ammo--;

  muzzleFlash=5;

  document.getElementById("ammo")
    .textContent=ammo;

}

/* PLAYER BULLETS */

function updateBullets(){

  bullets.forEach(b=>{

    b.x+=b.vx;
    b.y+=b.vy;

  });

  bullets=
    bullets.filter(b=>
      b.x>-30 &&
      b.x<canvas.width+30 &&
      b.y>-30 &&
      b.y<canvas.height+30
    );

}

/* HIT ENEMIES */

function bulletHits(){

  for(
    let b=bullets.length-1;
    b>=0;
    b--
  ){

    for(
      let e=enemies.length-1;
      e>=0;
      e--
    ){

      const bullet=bullets[b];
      const enemy=enemies[e];

      const dx=
        bullet.x-enemy.x;

      const dy=
        bullet.y-enemy.y;

      const d=
        Math.sqrt(dx*dx+dy*dy);

      if(
        d<
        enemy.size/2+5
      ){

        enemy.health-=
          bullet.damage;

        bullets.splice(b,1);

        if(enemy.health<=0){

          enemies.splice(e,1);

        }

        break;

      }

    }

  }

}

/* ENEMY SHOOT */

function enemyShoot(enemy){

  const dx=
    player.x-enemy.x;

  const dy=
    player.y-enemy.y;

  const distance=
    Math.sqrt(dx*dx+dy*dy);

  if(distance>500)
    return;

  enemyBullets.push({

    x:enemy.x,
    y:enemy.y,

    vx:
      (dx/distance)*6,

    vy:
      (dy/distance)*6,

    damage:8

  });

}

/* ENEMY MOVEMENT + ATTACK */

function updateEnemies(){

  enemies.forEach(enemy=>{

    const dx=
      player.x-enemy.x;

    const dy=
      player.y-enemy.y;

    const d=
      Math.sqrt(dx*dx+dy*dy);

    if(d>45){

      enemy.x+=
        (dx/d)*enemy.speed;

      enemy.y+=
        (dy/d)*enemy.speed;

    }

    /* CLOSE DAMAGE */

    if(d<42){

      enemy.attackCooldown--;

      if(enemy.attackCooldown<=0){

        player.health-=5;

        player.hitFlash=5;

        enemy.attackCooldown=30;

      }

    }

    /* ENEMY SHOOTING */

    enemy.shootCooldown--;

    if(
      enemy.shootCooldown<=0 &&
      d<500
    ){

      enemyShoot(enemy);

      enemy.shootCooldown=
        70+Math.random()*60;

    }

  });

}

/* ENEMY BULLETS */

function updateEnemyBullets(){

  enemyBullets.forEach(b=>{

    b.x+=b.vx;
    b.y+=b.vy;

  });

  for(
    let i=enemyBullets.length-1;
    i>=0;
    i--
  ){

    const b=enemyBullets[i];

    const dx=
      b.x-player.x;

    const dy=
      b.y-player.y;

    const d=
      Math.sqrt(dx*dx+dy*dy);

    if(d<20){

      player.health-=b.damage;

      player.hitFlash=6;

      enemyBullets.splice(i,1);

    }

  }

  enemyBullets=
    enemyBullets.filter(b=>
      b.x>-30 &&
      b.x<canvas.width+30 &&
      b.y>-30 &&
      b.y<canvas.height+30
    );

}

/* COLLECT LOOT */

function collectLoot(){

  for(
    let i=loot.length-1;
    i>=0;
    i--
  ){

    const item=loot[i];

    const dx=
      player.x-item.x;

    const dy=
      player.y-item.y;

    const d=
      Math.sqrt(dx*dx+dy*dy);

    if(d<35){

      if(item.type==="ammo"){

        ammo+=15;

      }

      if(item.type==="medkit"){

        player.health+=30;

        if(player.health>100)
          player.health=100;

      }

      loot.splice(i,1);

      document.getElementById("ammo")
        .textContent=ammo;

    }

  }

}

/* SAFE ZONE */

function updateSafeZone(){

  if(
    safeZone.radius>
    safeZone.minRadius
  ){

    safeZone.radius-=0.015;

  }

  const dx=
    player.x-safeZone.x;

  const dy=
    player.y-safeZone.y;

  const distance=
    Math.sqrt(dx*dx+dy*dy);

  if(
    distance>
    safeZone.radius
  ){

    player.health-=0.03;

  }

  const percentage=
    Math.max(
      0,
      Math.round(
        (
          safeZone.radius/
          (
            Math.min(
              canvas.width,
              canvas.height
            )*0.45
          )
        )*100
      )
    );

  document.getElementById("zone")
    .textContent=
    percentage+"%";

}

/* MESSAGE */

function message(text){

  document.getElementById(
    "messageText"
  ).textContent=text;

  document.getElementById(
    "message"
  ).style.display="block";

}

/* GAME LOOP */

function gameLoop(){

  drawMap();

  updateSafeZone();

  updateEnemies();

  updateBullets();

  updateEnemyBullets();

  bulletHits();

  collectLoot();

  drawSafeZone();

  drawLoot();

  drawBullets();

  drawEnemies();

  drawPlayer();

  document.getElementById("health")
    .textContent=
    Math.max(
      0,
      Math.floor(player.health)
    );

  document.getElementById("enemyCount")
    .textContent=
    enemies.length;

  if(player.health<=0){

    message("GAME OVER 💀");

    return;

  }

  if(enemies.length===0){

    message("YOU WIN! 🏆");

    return;

  }

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
  </html>
