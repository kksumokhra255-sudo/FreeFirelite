<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Battle Royale - Graphics Upgrade 6</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{display:block}

#info{
  position:fixed;
  top:10px;
  left:10px;
  color:white;
  background:rgba(0,0,0,.72);
  padding:10px 14px;
  border-radius:12px;
  font-size:16px;
  z-index:10;
  line-height:1.5;
  box-shadow:0 4px 15px rgba(0,0,0,.35);
}

#controls{
  position:fixed;
  bottom:18px;
  left:18px;
  z-index:10;
  text-align:center;
}

button{
  width:62px;
  height:52px;
  margin:3px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.82);
  font-size:21px;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,.25);
}

#shoot{
  position:fixed;
  right:20px;
  bottom:38px;
  width:105px;
  height:75px;
  border-radius:20px;
  background:#d94335;
  color:white;
  font-size:19px;
}

#message{
  display:none;
  position:fixed;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  background:rgba(0,0,0,.92);
  padding:25px;
  border-radius:18px;
  text-align:center;
  font-size:30px;
  z-index:20;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
}

#restart{
  width:150px;
  margin-top:15px;
  font-size:17px;
}
</style>
</head>

<body>

<div id="info">
❤️ Health: <span id="health">100</span><br>
🎯 Enemies: <span id="enemyCount">6</span><br>
🔫 Ammo: <span id="ammo">30</span><br>
🟢 Safe Zone: <span id="zone">100%</span>
</div>

<canvas id="game"></canvas>

<div id="controls">
  <div>
    <button onclick="move(0,-1)">⬆️</button>
  </div>

  <div>
    <button onclick="move(-1,0)">⬅️</button>
    <button onclick="move(1,0)">➡️</button>
  </div>

  <div>
    <button onclick="move(0,1)">⬇️</button>
  </div>
</div>

<button id="shoot" onclick="shoot()">FIRE 🔫</button>

<div id="message">
  <div id="messageText"></div>
  <button id="restart" onclick="location.reload()">RESTART</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

resize();
window.addEventListener("resize",resize);

/* PLAYER */

let player={
  x:canvas.width/2,
  y:canvas.height/2,
  size:30,
  speed:18,
  health:100,
  angle:0,
  hitFlash:0
};

let ammo=30;

let bullets=[];
let enemyBullets=[];
let enemies=[];
let loot=[];
let effects=[];

/* SAFE ZONE */

let safeZone={
  x:canvas.width/2,
  y:canvas.height/2,
  radius:Math.min(canvas.width,canvas.height)*.45,
  minRadius:Math.min(canvas.width,canvas.height)*.18
};

/* BUILDINGS */

let obstacles=[
  {x:120,y:150,w:95,h:65},
  {x:canvas.width-215,y:170,w:105,h:70},
  {x:150,y:canvas.height-195,w:105,h:70},
  {x:canvas.width-260,y:canvas.height-185,w:115,h:75}
];

/* TREES */

let trees=[];

for(let i=0;i<12;i++){

  trees.push({
    x:Math.random()*(canvas.width-60)+30,
    y:Math.random()*(canvas.height-100)+50,
    size:18+Math.random()*8
  });

}

/* ROCKS */

let rocks=[];

for(let i=0;i<10;i++){

  rocks.push({
    x:Math.random()*(canvas.width-50)+25,
    y:Math.random()*(canvas.height-100)+50,
    size:8+Math.random()*8
  });

}

/* ENEMIES */

for(let i=0;i<6;i++){

  enemies.push({

    x:Math.random()*(canvas.width-80)+40,
    y:Math.random()*(canvas.height-160)+80,

    size:28,
    health:100,

    speed:.65+Math.random()*.55,

    attackCooldown:0,
    shootCooldown:60+Math.random()*80

  });

}

/* LOOT */

for(let i=0;i<8;i++){

  loot.push({

    x:Math.random()*(canvas.width-80)+40,
    y:Math.random()*(canvas.height-120)+60,

    type:i%3===0?"medkit":"ammo"

  });

}

/* MAP */

function drawMap(){

  ctx.fillStyle="#4f963e";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  /* GRASS */

  ctx.strokeStyle="rgba(255,255,255,.06)";
  ctx.lineWidth=1;

  for(let x=0;x<canvas.width;x+=35){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,canvas.height);
    ctx.stroke();

  }

  for(let y=0;y<canvas.height;y+=35){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(canvas.width,y);
    ctx.stroke();

  }

  /* BUILDINGS */

  obstacles.forEach(o=>{

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.fillRect(
      o.x+6,
      o.y+7,
      o.w,
      o.h
    );

    ctx.fillStyle="#70472c";

    ctx.fillRect(
      o.x,
      o.y,
      o.w,
      o.h
    );

    ctx.fillStyle="#9b6a42";

    ctx.fillRect(
      o.x+7,
      o.y+7,
      o.w-14,
      o.h-14
    );

    /* WINDOWS */

    ctx.fillStyle="#6ec5df";

    ctx.fillRect(
      o.x+18,
      o.y+18,
      18,
      16
    );

    ctx.fillRect(
      o.x+o.w-36,
      o.y+18,
      18,
      16
    );

  });

  /* ROCKS */

  rocks.forEach(r=>{

    ctx.fillStyle="rgba(0,0,0,.2)";

    ctx.beginPath();

    ctx.ellipse(
      r.x+3,
      r.y+5,
      r.size,
      r.size*.55,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#777";

    ctx.beginPath();

    ctx.arc(
      r.x,
      r.y,
      r.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  /* TREES */

  trees.forEach(t=>{

    ctx.fillStyle="rgba(0,0,0,.22)";

    ctx.beginPath();

    ctx.ellipse(
      t.x+4,
      t.y+8,
      t.size,
      t.size*.5,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#704522";

    ctx.fillRect(
      t.x-5,
      t.y,
      10,
      25
    );

    ctx.fillStyle="#176d2b";

    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y-7,
      t.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#23913a";

    ctx.beginPath();

    ctx.arc(
      t.x-7,
      t.y-13,
      t.size*.65,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

}

/* SAFE ZONE */

function drawSafeZone(){

  ctx.fillStyle="rgba(35,70,230,.20)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.save();

  ctx.globalCompositeOperation="destination-out";

  ctx.beginPath();

  ctx.arc(
    safeZone.x,
    safeZone.y,
    safeZone.radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  ctx.strokeStyle="rgba(90,190,255,.95)";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.arc(
    safeZone.x,
    safeZone.y,
    safeZone.radius,
    0,
    Math.PI*2
  );

  ctx.stroke();

}

/* LOOT */

function drawLoot(){

  loot.forEach(item=>{

    /* glow */

    ctx.shadowBlur=12;

    if(item.type==="ammo"){

      ctx.shadowColor="#ffd21f";

      ctx.fillStyle="#ffd21f";

      ctx.fillRect(
        item.x-11,
        item.y-11,
        22,
        22
      );

      ctx.fillStyle="#222";

      ctx.font="bold 15px Arial";

      ctx.fillText(
        "A",
        item.x-5,
        item.y+5
      );

    }else{

      ctx.shadowColor="#ffffff";

      ctx.fillStyle="white";

      ctx.fillRect(
        item.x-12,
        item.y-12,
        24,
        24
      );

      ctx.fillStyle="red";

      ctx.fillRect(
        item.x-4,
        item.y-10,
        8,
        20
      );

      ctx.fillRect(
        item.x-10,
        item.y-4,
        20,
        8
      );

    }

    ctx.shadowBlur=0;

  });

}

/* PLAYER */

function drawPlayer(){

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    player.x,
    player.y+14,
    20,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* body */

  ctx.fillStyle=
    player.hitFlash>0?
    "white":"#1769ff";

  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y,
    16,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* head */

  ctx.fillStyle="#ffd0a0";

  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y-7,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* helmet */

  ctx.fillStyle="#263238";

  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y-10,
    10,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  /* gun */

  const gunLength=32;

  const gunX=
    player.x+
    Math.cos(player.angle)*gunLength;

  const gunY=
    player.y+
    Math.sin(player.angle)*gunLength;

  ctx.strokeStyle="#202020";
  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    player.x,
    player.y
  );

  ctx.lineTo(
    gunX,
    gunY
  );

  ctx.stroke();

  /* muzzle */

  if(muzzleFlash>0){

    ctx.shadowBlur=18;
    ctx.shadowColor="#ffd21f";

    ctx.fillStyle="#ffe033";

    ctx.beginPath();

    ctx.arc(
      gunX,
      gunY,
      11,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    muzzleFlash--;

  }

}

/* ENEMIES */

function drawEnemies(){

  enemies.forEach(enemy=>{

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
      enemy.x,
      enemy.y+14,
      19,
      7,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    /* body */

    ctx.fillStyle="#c71919";

    ctx.beginPath();

    ctx.arc(
      enemy.x,
      enemy.y,
      16,
      0,
      Math.PI*2
    );

    ctx.fill();

    /* head */

    ctx.fillStyle="#e8a37d";

    ctx.beginPath();

    ctx.arc(
      enemy.x,
      enemy.y-7,
      9,
      0,
      Math.PI*2
    );

    ctx.fill();

    /* helmet */

    ctx.fillStyle="#421818";

    ctx.beginPath();

    ctx.arc(
      enemy.x,
      enemy.y-10,
      10,
      Math.PI,
      Math.PI*2
    );

    ctx.fill();

    /* health bar */

    ctx.fillStyle="#222";

    ctx.fillRect(
      enemy.x-20,
      enemy.y-27,
      40,
      6
    );

    ctx.fillStyle="#35d447";

    ctx.fillRect(
      enemy.x-20,
      enemy.y-27,
      40*(enemy.health/100),
      6
    );

  });

}

/* BULLETS */

function drawBullets(){

  bullets.forEach(b=>{

    ctx.shadowBlur=10;
    ctx.shadowColor="#ffe01b";

    ctx.fillStyle="#ffe01b";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      5,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

  });

  enemyBullets.forEach(b=>{

    ctx.shadowBlur=10;
    ctx.shadowColor="#ff3333";

    ctx.fillStyle="#ff4040";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      5,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

  });

}

/* EFFECTS */

function drawEffects(){

  effects.forEach(e=>{

    ctx.globalAlpha=e.life;

    ctx.fillStyle="#ffd21f";

    ctx.beginPath();

    ctx.arc(
      e.x,
      e.y,
      e.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    e.size+=1.5;
    e.life-=.08;

  });

  ctx.globalAlpha=1;

  effects=
    effects.filter(e=>e.life>0);

}

/* MOVE */

function move(dx,dy){

  player.x+=dx*player.speed;
  player.y+=dy*player.speed;

  player.x=Math.max(
    20,
    Math.min(
      canvas.width-20,
      player.x
    )
  );

  player.y=Math.max(
    20,
    Math.min(
      canvas.height-20,
      player.y
    )
  );

  if(dx!==0||dy!==0){

    player.angle=
      Math.atan2(dy,dx);

  }

}

/* NEAREST */

function nearestEnemy(){

  let target=null;
  let best=Infinity;

  enemies.forEach(enemy=>{

    const dx=
      enemy.x-player.x;

    const dy=
      enemy.y-player.y;

    const d=
      Math.sqrt(dx*dx+dy*dy);

    if(d<best){

      best=d;
      target=enemy;

    }

  });

  return target;

}

/* SHOOT */

function shoot(){

  if(ammo<=0)
    return;

  const target=
    nearestEnemy();

  if(!target)
    return;

  const dx=
    target.x-player.x;

  const dy=
    target.y-player.y;

  const distance=
    Math.sqrt(dx*dx+dy*dy);

  player.angle=
    Math.atan2(dy,dx);

  bullets.push({

    x:
      player.x+
      Math.cos(player.angle)*25,

    y:
      player.y+
      Math.sin(player.angle)*25,

    vx:
      (dx/distance)*13,

    vy:
      (dy/distance)*13,

    damage:50

  });

  ammo--;

  muzzleFlash=6;

  document.getElementById("ammo")
    .textContent=ammo;

}

/* BULLET UPDATE */

function updateBullets(){

  bullets.forEach(b=>{

    b.x+=b.vx;
    b.y+=b.vy;

  });

  bullets=
    bullets.filter(b=>
      b.x>-30 &&
      b.x<canvas.width+30 &&
      b.y>-30 &&
      b.y<canvas.height+30
    );

}

/* BULLET HIT */

function bulletHits(){

  for(
    let b=bullets.length-1;
    b>=0;
    b--
  ){

    for(
      let e=enemies.length-1;
      e>=0;
      e--
    ){

      const bullet=bullets[b];
      const enemy=enemies[e];

      const dx=
        bullet.x-enemy.x;

      const dy=
        bullet.y-enemy.y;

      const d=
        Math.sqrt(dx*dx+dy*dy);

      if(
        d<
        enemy.size/2+6
      ){

        enemy.health-=bullet.damage;

        effects.push({
          x:bullet.x,
          y:bullet.y,
          size:3,
          life:1
        });

        bullets.splice(b,1);

        if(enemy.health<=0){

          enemies.splice(e,1);

        }

        break;

      }

    }

  }

}

/* ENEMY SHOOT */

function enemyShoot(enemy){

  const dx=
    player.x-enemy.x;

  const dy=
    player.y-enemy.y;

  const distance=
    Math.sqrt(dx*dx+dy*dy);

  if(distance>500)
    return;

  enemyBullets.push({

    x:enemy.x,
    y:enemy.y,

    vx:
      (dx/distance)*6,

    vy:
      (dy/distance)*6,

    damage:8

  });

}

/* ENEMIES */

function updateEnemies(){

  enemies.forEach(enemy=>{

    const dx=
      player.x-enemy.x;

    const dy=
      player.y-enemy.y;

    const d=
      Math.sqrt(dx*dx+dy*dy);

    if(d>45){

      enemy.x+=
        (dx/d)*enemy.speed;

      enemy.y+=
        (dy/d)*enemy.speed;

    }

    if(d<42){

      enemy.attackCooldown--;

      if(enemy.attackCooldown<=0){

        player.health-=5;

        player.hitFlash=7;

        enemy.attackCooldown=30;

      }

    }

    enemy.shootCooldown--;

    if(
      enemy.shootCooldown<=0 &&
      d<500
    ){

      enemyShoot(enemy);

      enemy.shootCooldown=
        70+Math.random()*60;

    }

  });

  if(player.hitFlash>0)
    player.hitFlash--;

}

/* ENEMY BULLETS */

function updateEnemyBullets(){

  enemyBullets.forEach(b=>{

    b.x+=b.vx;
    b.y+=b.vy;

  });

  for(
    let i=enemyBullets.length-1;
    i>=0;
    i--
  ){

    const b=enemyBullets[i];

    const dx=
      b.x-player.x;

    const dy=
      b.y-player.y;

    const d=
      Math.sqrt(dx*dx+dy*dy);

    if(d<20){

      player.health-=b.damage;

      player.hitFlash=8;

      effects.push({
        x:player.x,
        y:player.y,
        size:5,
        life:1
      });

      enemyBullets.splice(i,1);

    }

  }

  enemyBullets=
    enemyBullets.filter(b=>
      b.x>-30 &&
      b.x<canvas.width+30 &&
      b.y>-30 &&
      b.y<canvas.height+30
    );

}

/* LOOT */

function collectLoot(){

  for(
    let i=loot.length-1;
    i>=0;
    i--
  ){

    const item=loot[i];

    const dx=
      player.x-item.x;

    const dy=
      player.y-item.y;

    const d=
      Math.sqrt(dx*dx+dy*dy);

    if(d<35){

      if(item.type==="ammo"){

        ammo+=15;

      }else{

        player.health+=30;

        if(player.health>100)
          player.health=100;

      }

      loot.splice(i,1);

      document.getElementById("ammo")
        .textContent=ammo;

    }

  }

}

/* SAFE ZONE */

function updateSafeZone(){

  if(
    safeZone.radius>
    safeZone.minRadius
  ){

    safeZone.radius-=.015;

  }

  const dx=
    player.x-safeZone.x;

  const dy=
    player.y-safeZone.y;

  const distance=
    Math.sqrt(dx*dx+dy*dy);

  if(
    distance>
    safeZone.radius
  ){

    player.health-=.03;

  }

  const percentage=
    Math.max(
      0,
      Math.round(
        (
          safeZone.radius/
          (
            Math.min(
              canvas.width,
              canvas.height
            )*.45
          )
        )*100
      )
    );

  document.getElementById("zone")
    .textContent=
    percentage+"%";

}

/* MESSAGE */

function message(text){

  document.getElementById(
    "messageText"
  ).textContent=text;

  document.getElementById(
    "message"
  ).style.display="block";

}

/* GAME LOOP */

function gameLoop(){

  drawMap();

  updateSafeZone();
  updateEnemies();
  updateBullets();
  updateEnemyBullets();
  bulletHits();
  collectLoot();

  drawSafeZone();
  drawLoot();
  drawBullets();
  drawEffects();
  drawEnemies();
  drawPlayer();

  document.getElementById("health")
    .textContent=
    Math.max(
      0,
      Math.floor(player.health)
    );

  document.getElementById("enemyCount")
    .textContent=
    enemies.length;

  if(player.health<=0){

    message("GAME OVER 💀");

    return;

  }

  if(enemies.length===0){

    message("YOU WIN! 🏆");

    return;

  }

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
  </html>
