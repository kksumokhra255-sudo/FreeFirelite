<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Battle Royale - Upgrade 4</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{display:block}

#info{
  position:fixed;
  top:10px;
  left:10px;
  color:white;
  background:rgba(0,0,0,.7);
  padding:10px 14px;
  border-radius:10px;
  font-size:16px;
  z-index:10;
  line-height:1.5;
}

#controls{
  position:fixed;
  bottom:18px;
  left:18px;
  z-index:10;
  text-align:center;
}

button{
  width:62px;
  height:52px;
  margin:3px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.82);
  font-size:21px;
  font-weight:bold;
}

#shoot{
  position:fixed;
  right:20px;
  bottom:38px;
  width:105px;
  height:75px;
  border-radius:20px;
  background:#d94335;
  color:white;
  font-size:19px;
}

#message{
  display:none;
  position:fixed;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  background:rgba(0,0,0,.88);
  padding:25px;
  border-radius:15px;
  text-align:center;
  font-size:30px;
  z-index:20;
}

#restart{
  width:150px;
  margin-top:15px;
  font-size:17px;
}
</style>
</head>

<body>

<div id="info">
❤️ Health: <span id="health">100</span><br>
🎯 Enemies: <span id="enemyCount">6</span><br>
🔫 Ammo: <span id="ammo">30</span><br>
🟢 Safe Zone: <span id="zone">100%</span>
</div>

<canvas id="game"></canvas>

<div id="controls">
  <div>
    <button onclick="move(0,-1)">⬆️</button>
  </div>

  <div>
    <button onclick="move(-1,0)">⬅️</button>
    <button onclick="move(1,0)">➡️</button>
  </div>

  <div>
    <button onclick="move(0,1)">⬇️</button>
  </div>
</div>

<button id="shoot" onclick="shoot()">FIRE 🔫</button>

<div id="message">
  <div id="messageText"></div>
  <button id="restart" onclick="location.reload()">RESTART</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

resize();
window.addEventListener("resize",resize);

let player={
  x:canvas.width/2,
  y:canvas.height/2,
  size:28,
  speed:18,
  health:100,
  angle:0
};

let ammo=30;
let bullets=[];
let enemies=[];
let loot=[];

let muzzleFlash=0;

/* Safe zone */
let safeZone={
  x:canvas.width/2,
  y:canvas.height/2,
  radius:Math.min(canvas.width,canvas.height)*0.45,
  minRadius:Math.min(canvas.width,canvas.height)*0.18
};

/* Obstacles */
let obstacles=[
  {x:120,y:150,w:90,h:60},
  {x:canvas.width-210,y:170,w:100,h:65},
  {x:150,y:canvas.height-190,w:100,h:65},
  {x:canvas.width-250,y:canvas.height-180,w:110,h:70}
];

/* Enemies */
for(let i=0;i<6;i++){

  enemies.push({
    x:Math.random()*(canvas.width-80)+40,
    y:Math.random()*(canvas.height-160)+80,
    size:25,
    health:100,
    speed:.65+Math.random()*.55,
    attackCooldown:0
  });

}

/* Loot */
for(let i=0;i<5;i++){

  loot.push({
    x:Math.random()*(canvas.width-80)+40,
    y:Math.random()*(canvas.height-120)+60,
    type:"ammo"
  });

}

  ctx.fillStyle="#5c9b45";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="rgba(255,255,255,.10)";

  for(let x=0;x<canvas.width;x+=50){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,canvas.height);
    ctx.stroke();

  }

  for(let y=0;y<canvas.height;y+=50){

    ctx.moveTo(0,y);
    ctx.lineTo(canvas.width,y);
